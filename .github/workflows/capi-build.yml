name: C ABI Build

# Builds the C ABI shared library (libtranscribe.so / transcribe.dll) for each
# GPU backend, mirroring audio.cpp's capi-build.yml. Produces a full CMake
# install tree per backend — lib/*.so + lib/transcribe-link.json + include/ +
# bin/*.dll — so downstream Rust crates can consume it via
# TRANSCRIBE_PREBUILT_PREFIX without a C++ toolchain or GPU SDK.
#
# Linux jobs run in vendor containers (CUDA/ROCm/SYCL) and are the reliable
# signal. Windows CUDA must pass; Windows ROCm and SYCL are best-effort
# (continue-on-error): hosted runners have no AMD/Intel GPU, so they only
# prove MSVC/HIP-clang/icpx configure/compile, and the vendor toolchains are
# large/flaky.

on:
  push:
    branches:
      - main
      - dev
      - capi/**
    paths:
      - '.github/workflows/capi-build.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'include/**'
      - 'ggml/CMakeLists.txt'
      - 'ggml/cmake/**'
      - 'ggml/include/**'
      - 'ggml/src/**'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # needed to save toolchain caches

env:
  CUDA_ARCHS: "61;70;75;80;86;89;120"
  AMDGPU_TARGETS: "gfx1100;gfx1101;gfx1102;gfx1150;gfx1151;gfx1200;gfx1201"
  # LunarG prunes old SDK downloads — when bumping, verify the URL exists.
  # Keep in lockstep with cuda-windows.yml / python-wheels.yml / rust-ci.yml.
  # Same version used on both Linux (tarball) and Windows (installer).
  VK_VERSION: "1.4.350.0"
  VULKAN_VERSION: "1.4.350.0"
  OSS_BUCKET: "miaosoft-internal"
  OSS_ENDPOINT: "oss-cn-shanghai.aliyuncs.com"
  OSS_PREFIX: "cunba.ai/transcribe.cpp"

concurrency:
  group: capi-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # Linux: CUDA+CPU, ROCm+CPU, SYCL+CPU, Vulkan+CPU
  # ════════════════════════════════════════════════════════════════════════
  linux:
    name: Linux ${{ matrix.config.name }}
    runs-on: ubuntu-22.04
    container:
      image: ${{ matrix.config.container }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: CUDA-CPU
            container: nvidia/cuda:12.9.1-devel-ubuntu22.04
            cmake_extra: '-DTRANSCRIBE_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES="61;70;75;80;86;89;120"'
            artifact_suffix: linux-cuda-cpu
          - name: ROCm-CPU
            container: rocm/dev-ubuntu-22.04:6.4-complete
            cmake_extra: '-DGGML_HIP=ON -DGPU_TARGETS="gfx1100;gfx1101;gfx1102;gfx1150;gfx1151;gfx1200;gfx1201" -DCMAKE_PREFIX_PATH=/opt/rocm'
            artifact_suffix: linux-rocm-cpu
          - name: SYCL-CPU
            container: intel/oneapi-basekit:2025.3.1-0-devel-ubuntu24.04
            cmake_extra: '-DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx -DGGML_SYCL=ON -DGGML_SYCL_TARGET=INTEL'
            artifact_suffix: linux-sycl-cpu
          # Vulkan + CPU on a stock Ubuntu image (no vendor toolchain).
          # libvulkan-dev provides the loader/headers; the shader compiler
          # (glslc) comes from the LunarG SDK tarball installed in a dedicated
          # step below. Hosted runners have no Vulkan-capable GPU, so this only
          # proves configure/compile/link — the runtime degradation contract
          # is covered by native-ci.yml's provider-dl-vulkan lane.
          - name: Vulkan-CPU
            container: ubuntu:22.04
            install_vulkan: 'true'
            cmake_extra: '-DTRANSCRIBE_VULKAN=ON'
            artifact_suffix: linux-vulkan-cpu

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build deps
        run: |
          apt-get update
          # Retry downloads: archive.ubuntu.com is intermittently unreachable
          # from inside GitHub Actions containers (transient connection drops).
          # patchelf: used in Collect artifacts to flatten the versioned
          # libtranscribe.so symlink chain into a single file (see there).
          DEPS="cmake git build-essential patchelf"
          # Vulkan backend needs the loader + headers; the compiler/shader
          # toolchain comes from the Vulkan SDK tarball below.
          if [ "${{ matrix.config.install_vulkan }}" = "true" ]; then
            DEPS="$DEPS libvulkan-dev wget tar"
          fi
          apt-get -o Acquire::Retries=5 install -y $DEPS

      - name: Install Vulkan SDK (Linux Vulkan job only)
        if: matrix.config.install_vulkan == 'true'
        run: |
          # Pull the portable Vulkan SDK tarball (no apt repo needed, and
          # Ubuntu's glslc package is not generally available — the SDK
          # ships its own glslc).
          wget -q "https://sdk.lunarg.com/sdk/download/${VK_VERSION}/linux/vulkansdk-linux-x86_64-${VK_VERSION}.tar.xz"
          tar xf "vulkansdk-linux-x86_64-${VK_VERSION}.tar.xz"
          echo "VULKAN_SDK=$PWD/${VK_VERSION}/x86_64" >> $GITHUB_ENV
          echo "$PWD/${VK_VERSION}/x86_64/bin" >> $GITHUB_PATH

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: capi-linux-${{ matrix.config.artifact_suffix }}
          update-package-index: true

      - name: Configure
        run: |
          # Source oneAPI env if present AND not already loaded (the SYCL
          # container auto-sources setvars, so re-sourcing errors out).
          if [ -f /opt/intel/oneapi/setvars.sh ] && [ -z "$ONEAPI_ROOT" ]; then
            . /opt/intel/oneapi/setvars.sh
          fi
          mkdir -p build
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            -DCMAKE_HIP_COMPILER_LAUNCHER=ccache \
            -DBUILD_SHARED_LIBS=ON \
            -DTRANSCRIBE_SHARED_EMBED=ON \
            -DTRANSCRIBE_INSTALL=ON \
            -DCMAKE_INSTALL_PREFIX=build/install \
            -DTRANSCRIBE_BUILD_TESTS=OFF \
            -DTRANSCRIBE_BUILD_EXAMPLES=OFF \
            -DTRANSCRIBE_BUILD_TOOLS=OFF \
            ${{ matrix.config.cmake_extra }}

      - name: Build & install transcribe
        run: |
          if [ -f /opt/intel/oneapi/setvars.sh ] && [ -z "$ONEAPI_ROOT" ]; then
            . /opt/intel/oneapi/setvars.sh
          fi
          cmake --build build --parallel $(nproc) --target transcribe
          cmake --install build

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          # Ship the entire install tree, then prune what prebuilt consumers
          # never need. Downstream points TRANSCRIBE_PREBUILT_PREFIX at this
          # unzipped tree and reads lib/transcribe-link.json (the manifest lists
          # ONLY `transcribe` in `libraries` — ggml is embedded into
          # libtranscribe.so at link time in SHARED_EMBED mode, so the ggml
          # static archives ggml's install rules drop in lib/ are dead weight).
          cp -r build/install/* artifacts/
          # Drop the redundant ggml static archives (~1.3GB for the CUDA
          # backend alone) and ggml's cmake package config (a prebuilt
          # consumer links via the manifest, never via find_package(ggml)).
          # libtranscribe.so* (the embedded artifact) is kept untouched.
          rm -f artifacts/lib/libggml*.a
          rm -rf artifacts/lib/cmake
          # Strip the embedded shared lib. In SHARED_EMBED mode the fatbin
          # (CUDA kernels for every arch, ~1.2GB) is the bulk and is NOT
          # debug data, so this only removes ggml's symbol tables (~90MB) —
          # but that's still real savings, and harmless on the non-CUDA
          # backends where the .so is tiny.
          strip artifacts/lib/*.so* 2>/dev/null || true
          # Flatten the versioned libtranscribe.so symlink chain
          # (libtranscribe.so -> .so.0.2 -> .so.0.2.0) into a SINGLE file.
          # CMake's VERSION/SOVERSION install rules produce that 3-link chain;
          # GitHub's upload-artifact dereferences symlinks into full file
          # copies, so the chain ships as THREE copies of the ~350MB-1.2GB
          # .so (the single biggest reason Linux artifacts were ~3x the
          # Windows size). Mirrors libaudiocpp.so: one file, no version suffix,
          # SONAME rewritten to match. A prebuilt consumer links
          # `-ltranscribe` and finds libtranscribe.so; the SONAME agrees with
          # the filename so the runtime linker is consistent.
          _real=$(readlink -f artifacts/lib/libtranscribe.so)
          _realbase=$(basename "$_real")
          patchelf --set-soname libtranscribe.so "$_real"
          # Remove the symlink chain (libtranscribe.so + .so.0.2) and any
          # other versioned names, keeping only the real file.
          find artifacts/lib -maxdepth 1 \( -name 'libtranscribe.so' -o -name 'libtranscribe.so.*' \) ! -name "$_realbase" -delete
          mv "$_real" artifacts/lib/libtranscribe.so
          # Hard assert: the manifest is load-bearing for prebuilt consumers.
          test -f artifacts/lib/transcribe-link.json || { \
            echo "##[error]transcribe-link.json missing from install tree — prebuilt mode will fail"; \
            exit 1; \
          }
          ls -la artifacts/lib/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: transcribe-${{ matrix.config.artifact_suffix }}
          path: artifacts/

  # ════════════════════════════════════════════════════════════════════════
  # Windows: CUDA+CPU (primary), Vulkan+CPU, ROCm+CPU (best-effort),
  #          SYCL+CPU (best-effort)
  # ════════════════════════════════════════════════════════════════════════
  windows:
    name: Windows ${{ matrix.config.name }}
    runs-on: windows-2022
    continue-on-error: ${{ matrix.config.best_effort }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: CUDA-CPU
            setup: cuda
            artifact_suffix: windows-cuda-cpu
            best_effort: false
          # Vulkan + CPU via the LunarG SDK (matches the wheel lanes'
          # VULKAN_VERSION). Hosted runners have no Vulkan-capable GPU, so
          # this only proves MSVC + glslc configure/compile/link.
          - name: Vulkan-CPU
            setup: vulkan
            artifact_suffix: windows-vulkan-cpu
            best_effort: false
          - name: ROCm-CPU
            setup: rocm
            artifact_suffix: windows-rocm-cpu
            best_effort: true
          - name: SYCL-CPU
            setup: sycl
            artifact_suffix: windows-sycl-cpu
            best_effort: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: capi-windows-${{ matrix.config.artifact_suffix }}
          update-package-index: true

      - name: Setup CUDA Toolkit
        if: matrix.config.setup == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.9.0'
          method: 'network'

      # ── Vulkan: LunarG SDK (glslc for the ggml-vulkan module) ─────────────
      # Mirrors cuda-windows.yml / python-wheels.yml's wheel-windows lane —
      # direct LunarG .exe installer with --accept-licenses/--confirm-command.
      # Only the SDK's glslc + headers are needed at build time; the runtime
      # Vulkan loader (vulkan-1.dll) is supplied by the host/driver, never
      # vendored — see the manifest's libraries list (transcribe only).
      - name: Install Vulkan SDK ${{ env.VULKAN_VERSION }}
        if: matrix.config.setup == 'vulkan'
        shell: pwsh
        run: |
          curl.exe -o "$env:RUNNER_TEMP\vulkan_sdk.exe" -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkan_sdk.exe"
          & "$env:RUNNER_TEMP\vulkan_sdk.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      # ── ROCm/HIP: real AMD HIP SDK installer (llama.cpp pattern) ──────────
      # Hosted runners have no AMD GPU, so this only proves configure/compile.
      # Best-effort (continue-on-error) — Linux ROCm is the reliable signal.
      - name: Cache ROCm Installation
        if: matrix.config.setup == 'rocm'
        id: cache-rocm
        uses: actions/cache@v5
        with:
          path: C:\Program Files\AMD\ROCm
          key: cache-gha-rocm-26.Q1-${{ runner.os }}

      - name: Install ROCm HIP SDK
        if: matrix.config.setup == 'rocm' && steps.cache-rocm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://download.amd.com/developer/eula/rocm-hub/AMD-Software-PRO-Edition-26.Q1-Win11-For-HIP.exe"
          Write-Host "Downloading AMD HIP SDK Installer..."
          Invoke-WebRequest -Uri $url -OutFile "${env:RUNNER_TEMP}\rocm-install.exe" -UseBasicParsing
          Write-Host "Installing AMD HIP SDK..."
          $proc = Start-Process "${env:RUNNER_TEMP}\rocm-install.exe" -ArgumentList '-install' -NoNewWindow -PassThru
          $completed = $proc.WaitForExit(600000)
          if (-not $completed) {
            Write-Host "##[error]ROCm installation timed out after 10 minutes. Killing the process."
            $proc.Kill()
            exit 1
          }
          if ($proc.ExitCode -ne 0) {
            Write-Host "##[error]ROCm installation failed with exit code $($proc.ExitCode)."
            exit 1
          }

      - name: Verify ROCm HIP SDK
        if: matrix.config.setup == 'rocm'
        shell: pwsh
        run: |
          $hipClang = Get-ChildItem -Path "C:\Program Files\AMD\ROCm" -Recurse -Filter "clang.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $hipClang) {
            Write-Host "##[error]AMD HIP SDK not found (no clang.exe under C:\Program Files\AMD\ROCm). Cannot proceed with ROCm build."
            exit 1
          }
          Write-Host "Found HIP clang at: $($hipClang.FullName)"

      # ── SYCL/DPC++: offline oneAPI installer + Level Zero (llama.cpp pattern) ──
      # Pinned to a known-good oneAPI Essentials offline installer. This URL
      # will eventually rot on Intel's release schedule — swap the constant
      # below if it 403/Access-Denies. Best-effort (continue-on-error).
      - name: Download & Install oneAPI
        if: matrix.config.setup == 'sycl'
        env:
          WINDOWS_BASEKIT_URL: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/b60765d1-2b85-4e85-86b6-cb0e9563a699/intel-deep-learning-essentials-2025.3.3.18_offline.exe
          WINDOWS_DPCPP_MKL: intel.oneapi.win.cpp-dpcpp-common:intel.oneapi.win.mkl.devel:intel.oneapi.win.dnnl:intel.oneapi.win.tbb.devel
        shell: cmd
        run: scripts\install-oneapi.bat "%WINDOWS_BASEKIT_URL%" "%WINDOWS_DPCPP_MKL%"

      - name: Install Level Zero SDK
        if: matrix.config.setup == 'sycl'
        env:
          LEVEL_ZERO_SDK_URL: https://github.com/oneapi-src/level-zero/releases/download/v1.28.2/level-zero-win-sdk-1.28.2.zip
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:LEVEL_ZERO_SDK_URL -OutFile "level-zero-win-sdk.zip" -UseBasicParsing
          Expand-Archive -Path "level-zero-win-sdk.zip" -DestinationPath "C:/level-zero-sdk" -Force
          "LEVEL_ZERO_V1_SDK_PATH=C:/level-zero-sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify oneAPI
        if: matrix.config.setup == 'sycl'
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files (x86)\Intel\oneAPI\setvars.bat") {
            Write-Host "oneAPI installed successfully"
          } else {
            Write-Host "##[error]oneAPI setvars.bat not found after install; DPC++ compiler unavailable. Cannot proceed with SYCL build."
            exit 1
          }

      - name: Configure (CUDA)
        if: matrix.config.setup == 'cuda'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S . -B build -G "Ninja" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER_LAUNCHER=ccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ^
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache ^
            -DBUILD_SHARED_LIBS=ON ^
            -DTRANSCRIBE_SHARED_EMBED=ON ^
            -DTRANSCRIBE_INSTALL=ON ^
            -DCMAKE_INSTALL_PREFIX=build/install ^
            -DTRANSCRIBE_BUILD_TESTS=OFF ^
            -DTRANSCRIBE_BUILD_EXAMPLES=OFF ^
            -DTRANSCRIBE_BUILD_TOOLS=OFF ^
            -DTRANSCRIBE_CUDA=ON ^
            -DCMAKE_CUDA_ARCHITECTURES="${{ env.CUDA_ARCHS }}"

      - name: Configure (Vulkan)
        if: matrix.config.setup == 'vulkan'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S . -B build -G "Ninja" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER_LAUNCHER=ccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ^
            -DBUILD_SHARED_LIBS=ON ^
            -DTRANSCRIBE_SHARED_EMBED=ON ^
            -DTRANSCRIBE_INSTALL=ON ^
            -DCMAKE_INSTALL_PREFIX=build/install ^
            -DTRANSCRIBE_BUILD_TESTS=OFF ^
            -DTRANSCRIBE_BUILD_EXAMPLES=OFF ^
            -DTRANSCRIBE_BUILD_TOOLS=OFF ^
            -DTRANSCRIBE_VULKAN=ON

      - name: Configure (ROCm)
        if: matrix.config.setup == 'rocm'
        shell: pwsh
        run: |
          $hipPath = (Resolve-Path 'C:\Program Files\AMD\ROCm\*\bin\clang.exe' | Split-Path | Split-Path)
          Write-Host "HIP_PATH: $hipPath"
          cmake -G "Unix Makefiles" -B build -S . `
            -DCMAKE_C_COMPILER="$hipPath\bin\clang.exe" `
            -DCMAKE_CXX_COMPILER="$hipPath\bin\clang++.exe" `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_HIP_COMPILER_LAUNCHER=ccache `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=ON `
            -DTRANSCRIBE_SHARED_EMBED=ON `
            -DTRANSCRIBE_INSTALL=ON `
            -DCMAKE_INSTALL_PREFIX=build/install `
            -DTRANSCRIBE_BUILD_TESTS=OFF `
            -DTRANSCRIBE_BUILD_EXAMPLES=OFF `
            -DTRANSCRIBE_BUILD_TOOLS=OFF `
            -DGGML_HIP=ON `
            -DGPU_TARGETS="${{ env.AMDGPU_TARGETS }}" `
            -DCMAKE_PREFIX_PATH="$hipPath"

      - name: Configure (SYCL)
        if: matrix.config.setup == 'sycl'
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64 --force
          cmake -S . -B build -G "Ninja" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER_LAUNCHER=ccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=icx ^
            -DBUILD_SHARED_LIBS=ON ^
            -DTRANSCRIBE_SHARED_EMBED=ON ^
            -DTRANSCRIBE_INSTALL=ON ^
            -DCMAKE_INSTALL_PREFIX=build/install ^
            -DTRANSCRIBE_BUILD_TESTS=OFF ^
            -DTRANSCRIBE_BUILD_EXAMPLES=OFF ^
            -DTRANSCRIBE_BUILD_TOOLS=OFF ^
            -DGGML_SYCL=ON ^
            -DGGML_SYCL_F16=OFF ^
            -DGGML_SYCL_TARGET=INTEL

      - name: Build & install transcribe (CUDA)
        if: matrix.config.setup == 'cuda'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build --parallel %NUMBER_OF_PROCESSORS% --target transcribe
          cmake --install build

      - name: Build & install transcribe (Vulkan)
        if: matrix.config.setup == 'vulkan'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build --parallel %NUMBER_OF_PROCESSORS% --target transcribe
          cmake --install build

      # ROCm builds with clang (HIP), not MSVC. Add HIP bin to PATH so the
      # clang/clang++ recorded by Configure remains invokable.
      - name: Build & install transcribe (ROCm)
        if: matrix.config.setup == 'rocm'
        shell: pwsh
        run: |
          $hipPath = (Resolve-Path 'C:\Program Files\AMD\ROCm\*\bin\clang.exe' | Split-Path | Split-Path)
          $env:Path = "$hipPath\bin;$env:Path"
          cmake --build build --parallel $env:NUMBER_OF_PROCESSORS --target transcribe
          cmake --install build

      # SYCL needs oneAPI's setvars.bat (for icx) AND vcvars64.bat (for cl,
      # the C frontend icx targets on Windows).
      - name: Build & install transcribe (SYCL)
        if: matrix.config.setup == 'sycl'
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64 --force
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build --parallel %NUMBER_OF_PROCESSORS% --target transcribe
          cmake --install build

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          # Ship the entire install tree, then prune what prebuilt consumers
          # never need. The manifest (lib/transcribe-link.json) lists ONLY
          # `transcribe` in `libraries`: in SHARED_EMBED mode ggml is embedded
          # into transcribe.dll at link time, so the ggml static archives
          # ggml's install rules drop in lib/ are dead weight — the CUDA one
          # alone is ~1.34GB. Keep transcribe.dll (the embedded artifact in
          # bin/), transcribe.lib (its import library), the headers, and the
          # manifest.
          Copy-Item -Path build\install\* -Destination artifacts\ -Recurse -Force
          # Drop redundant ggml static archives + ggml's cmake package config.
          # transcribe.lib is the .dll's import library (linker needs it) and
          # does NOT match the ggml*.lib glob, so it is kept.
          Get-ChildItem -Path artifacts\lib -Filter "ggml*.lib" -ErrorAction SilentlyContinue | Remove-Item -Force
          Remove-Item -Path artifacts\lib\cmake -Recurse -Force -ErrorAction SilentlyContinue
          # Hard assert: the manifest is load-bearing for prebuilt consumers.
          $manifest = "artifacts\lib\transcribe-link.json"
          if (-not (Test-Path $manifest)) {
            Write-Host "##[error]transcribe-link.json missing from install tree — prebuilt mode will fail"
            exit 1
          }
          Get-ChildItem -Path artifacts -Recurse | Select-Object FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: transcribe-${{ matrix.config.artifact_suffix }}
          path: artifacts/

  # ════════════════════════════════════════════════════════════════════════
  # Publish to Alibaba Cloud OSS (always runs; best-effort Windows jobs
  # that fail are skipped since their artifacts won't exist)
  # ════════════════════════════════════════════════════════════════════════
  publish-oss:
    name: Publish to OSS
    runs-on: ubuntu-22.04
    needs: [linux, windows]
    if: always()

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute version strings
        run: |
          echo "BUILD_DATE=$(date -u +%Y%m%d)" >> $GITHUB_ENV
          echo "COMMIT_ID=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./artifact

      - name: List downloaded artifacts
        run: ls -R artifact/ || true

      - name: Install ossutil
        run: |
          curl -o ossutil64 "https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64"
          chmod +x ossutil64
          ./ossutil64 version || true

      - name: Upload to OSS
        env:
          OSS_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_KEY: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -e
          # Each artifact downloads as a subdirectory (transcribe-windows-cuda-cpu/,
          # transcribe-linux-sycl-cpu/, etc). Zip each into a single .zip for OSS.
          # The zip preserves the install-tree layout so a consumer can unzip and
          # point TRANSCRIBE_PREBUILT_PREFIX at the result.
          mkdir -p zips
          for d in artifact/*/; do
            name=$(basename "$d")
            # Verify the artifact has the manifest before zipping (embed mode:
            # lib/transcribe-link.json). Skip incomplete artifacts from
            # cancelled/failed jobs rather than shipping a broken zip.
            if [ ! -f "${d}lib/transcribe-link.json" ]; then
              echo "SKIP ${name}: no lib/transcribe-link.json (incomplete artifact)"
              continue
            fi
            # -y preserves symlinks instead of dereferencing them. Without it
            # the Linux libtranscribe.so -> .so.0.2 -> .so.0.2.0 chain gets
            # stored as THREE copies of the ~1.2GB .so (the single biggest
            # reason the Linux artifact was 1.8GB vs Windows' 927MB).
            (cd "$d" && zip -ry "../../zips/${name}.zip" .)
            echo "zipped ${name}.zip ($(du -sh ../../zips/${name}.zip | cut -f1))"
          done
          if [ ! -d zips ] || [ -z "$(ls -A zips 2>/dev/null)" ]; then
            echo "No artifacts to upload"; exit 0
          fi
          for f in zips/*.zip; do
            [ -f "$f" ] || continue
            echo "== $f =="
            # Dated snapshot (retention/history)
            ./ossutil64 cp "$f" "oss://${{ env.OSS_BUCKET }}/${{ env.OSS_PREFIX }}/${{ env.BUILD_DATE }}-${{ env.COMMIT_ID }}/$(basename $f)" \
              -i "$OSS_ID" -k "$OSS_KEY" -e "${{ env.OSS_ENDPOINT }}" -f
            # Latest pointer (always overwritten)
            ./ossutil64 cp "$f" "oss://${{ env.OSS_BUCKET }}/${{ env.OSS_PREFIX }}/latest/$(basename $f)" \
              -i "$OSS_ID" -k "$OSS_KEY" -e "${{ env.OSS_ENDPOINT }}" -f
          done
